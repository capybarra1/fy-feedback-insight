const el=id=>document.getElementById(id), bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function lock(){el('app').replaceChildren();el('top').hidden=true;el('login').hidden=false;el('password').value='';el('error').textContent=''}
let attempt=0;
el('form').addEventListener('submit',async e=>{e.preventDefault();const ticket=++attempt, input=el('password');el('submit').disabled=true;el('error').textContent='';try{
 const pack=JSON.parse(el('sealed').textContent), material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:bytes(pack.salt),iterations:pack.rounds},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(pack.iv)},key,bytes(pack.data));
 if(ticket!==attempt)return;
 const frame=document.createElement('iframe');frame.id='frame';frame.title='座舱反馈工作台';frame.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox');frame.setAttribute('referrerpolicy','no-referrer');frame.srcdoc=new TextDecoder().decode(plain);new Uint8Array(plain).fill(0);el('app').replaceChildren(frame);input.value='';el('login').hidden=true;el('top').hidden=false;
 }catch{if(ticket===attempt)el('error').textContent='无法解锁，请检查管理员密码。'}finally{el('submit').disabled=false}});
el('logout').addEventListener('click',()=>{attempt++;lock();el('password').focus()});window.addEventListener('pagehide',()=>{attempt++;lock()});
</script></body></html>
