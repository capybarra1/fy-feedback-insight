<script>
const $ = id => document.getElementById(id);
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let attempt = 0;
function lock() {
  attempt++;
  $('app').replaceChildren();
  $('gate').hidden = false;
  $('password').value = '';
  $('message').textContent = '';
}
window.addEventListener('message', event => {
  if ($('frame') && event.source === $('frame').contentWindow && event.data?.type === 'firefly-lock') {
    lock();
    $('password').focus();
  }
});
window.addEventListener('pagehide',lock);
$('login-form').addEventListener('submit', async event => {
  event.preventDefault();
  const ticket = ++attempt;
  const input = $('password');
  $('submit').disabled = true;
  $('message').textContent = '';
  try {
    const payload = JSON.parse($('sealed').textContent);
    const material = await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:bytes(payload.salt),iterations:payload.rounds},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));
    let html;
    try {
      const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
      html = await new Response(stream).text();
    } finally {
      new Uint8Array(plain).fill(0);
    }
    if (ticket !== attempt) return;
    const frame = document.createElement('iframe');
    frame.id = 'frame';
    frame.title = '座舱反馈工作台';
    frame.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads');
    frame.setAttribute('referrerpolicy','no-referrer');
    frame.srcdoc = html;
    $('app').replaceChildren(frame);
    input.value = '';
    $('gate').hidden = true;
  } catch {
    if (ticket === attempt) $('message').textContent = '无法解锁，请检查管理员密码。';
  } finally {
    $('submit').disabled = false;
  }
});
</script></body></html>
