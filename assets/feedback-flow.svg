<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380"><rect width="1400" height="380" rx="20" fill="#f1efe8"/><text x="48" y="65" font-size="28" font-family="sans-serif" fill="#203b32">从用户原文，到可复核的产品观点</text><text x="48" y="99" font-size="17" font-family="sans-serif" fill="#73776f">公开流程示意 · 不能用程序校验代替语义评测</text><g fill="#fff" stroke="#ccd2c5"><rect x="48" y="155" width="205" height="120" rx="12"/><rect x="325" y="155" width="205" height="120" rx="12"/><rect x="602" y="155" width="205" height="120" rx="12"/><rect x="879" y="155" width="205" height="120" rx="12"/><rect x="1156" y="155" width="195" height="120" rx="12"/></g><g font-family="sans-serif" font-size="21" fill="#24352d"><text x="74" y="200">导入与去重</text><text x="351" y="200">分流与抽取</text><text x="628" y="200">证据与校验</text><text x="905" y="200">人工复核</text><text x="1182" y="200">看板与导出</text></g><g font-family="sans-serif" font-size="16" fill="#717b71"><text x="74" y="238">稳定 ID · 原文保留</text><text x="351" y="238">功能 · 多观点 · 情感</text><text x="628" y="238">结构合法 ≠ 语义正确</text><text x="905" y="238">修正 · 版本保护</text><text x="1182" y="238">统计口径可解释</text></g><g stroke="#50735e" stroke-width="3"><path d="M264 215h45m-9-7 9 7-9 7M541 215h45m-9-7 9 7-9 7M818 215h45m-9-7 9 7-9 7M1095 215h45m-9-7 9 7-9 7"/></g><text x="48" y="335" font-size="17" font-family="sans-serif" fill="#73776f">贯穿全程：预算与失败可见、来源可追溯、人工结果优先</text></svg>
